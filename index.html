<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة أبو العربي | الكتب الرقمية</title>
    <!-- استدعاء خطوط عربية فاخرة من جوجل -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e3a8a;
            --accent: #d97706;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding-bottom: 40px;
        }

        /* الهيدر الأنيق والفخم */
        header {
            background: linear-gradient(135deg, #0f172a, #1e3a8a, #312e81);
            color: white;
            text-align: center;
            padding: 50px 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            border-bottom: 4px solid var(--accent);
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 70%);
            pointer-events: none;
        }

        /* استايل اسم المكتبة الأنيق والمتعوب عليه */
        .brand-title {
            font-family: 'Amiri', serif;
            font-size: 3.2rem;
            font-weight: 700;
            color: #fef3c7;
            margin-bottom: 15px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.4), 0 0 20px rgba(217, 119, 6, 0.3);
            letter-spacing: 1px;
            display: inline-block;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 5px;
        }

        header p {
            font-size: 1.15rem;
            opacity: 0.9;
            max-width: 650px;
            margin: 0 auto;
            color: #e2e8f0;
            font-weight: 400;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* شبكة الحزم */
        .packages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        .package-card {
            background: var(--card-bg);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0,0,0,0.06);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
        }

        .package-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.1);
        }

        .card-header {
            background-color: #3b82f6;
            color: white;
            padding: 22px;
            text-align: center;
        }

        .card-header h2 {
            font-size: 1.35rem;
            font-weight: 700;
        }

        .card-body {
            padding: 22px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-body p {
            color: #475569;
            font-size: 0.98rem;
        }

        .price-tag {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--accent);
            margin: 15px 0;
        }

        .btn-order {
            display: block;
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 13px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }

        .btn-order:hover {
            background-color: #1d4ed8;
            transform: scale(1.01);
        }

        /* النافذة المنبثقة للطلب (Modal) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
